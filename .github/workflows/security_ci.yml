name: GenoChain Scheduled Deep Security Assurance

# Runs on weekly schedule & manual dispatch (push/PR verification is handled solely by ci.yml to avoid duplicate runs)
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-contract-tests:
    name: 1. EVM Smart Contracts & Cryptographic Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Codebase Recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install web3==7.16.0 cryptography==46.0.3 eth-account==0.14.0

      - name: Compile Smart Contracts & Enforce EIP-170 Bytecode Ceiling
        run: |
          npx hardhat compile
          python scripts/audit/check_eip170.py

      - name: Run Hardhat Smart Contract & Cryptographic Verification Suite
        run: npm test

      - name: Run Independent Adversarial Stress Suite
        run: npm run test:stress

  static-analysis-and-linting:
    name: 2. Static Analysis & Linter Verification (Slither & Solhint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smart-contract-tests
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies, Solc 0.8.24 & Pinned Slither
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Solhint Linter (Zero Warnings Enforced)
        run: npm run lint:sol

      - name: Compile Contracts for Slither Analysis
        run: npx hardhat compile

      - name: Run Slither Static Analyzer (Fail on High/Medium in Production Contracts)
        run: npm run audit:slither

  frontend-build-and-audit:
    name: 3. Frontend Production Build & Zero-Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Root & Frontend Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Audit Root & Frontend Production Dependencies (Zero Vulnerabilities)
        run: |
          npm audit --omit=dev
          npm --prefix frontend audit --omit=dev

      - name: Build Production Frontend Assets
        run: npm --prefix frontend run build

      - name: Verify i18n Dictionaries, Frontend Structure & UI/UX Adversarial Suite
        run: |
          node scripts/audit/verify_frontend_dictionaries.mjs
          node scripts/audit/i18n_parity.mjs
          node scripts/audit/ui_ux_adversarial_suite.mjs

  academic-and-web3-hygiene:
    name: 4. Academic Hygiene & Web3.py Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pinned Python Web3 & Cryptography Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3==7.16.0 cryptography==46.0.3 eth-account==0.14.0

      - name: Run Shell, Python & Academic Hygiene Verification
        run: |
          bash -n deploy/kubo-private-init.sh
          python -m py_compile scripts/demo/capsule_dispatcher.py deploy/ipfs_access_gateway.py deploy/generate_swarm_key.py
          python scripts/audit/academic_hygiene_toolkit.py --selftest

      - name: Run Web3.py Contract ABI Verification
        run: python scripts/demo/web3_demo.py --offline-demo