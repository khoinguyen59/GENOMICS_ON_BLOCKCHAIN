<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="genochain-banner-title genochain-banner-desc">
  <title id="genochain-banner-title">GenoChain — Hạ tầng Trao đổi Dữ liệu Hệ gen Tự chủ &amp; Xác thực Không tiết lộ</title>
  <desc id="genochain-banner-desc">Mã hóa AEAD phân đoạn 64 KB phía máy khách, ký quỹ khóa thời gian phi lưu ký, bản quyền chủ động EIP-2981, tìm kiếm đặc tính ẩn danh và xác thực biến thể Groth16 BN254.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-emerald" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="strand-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="strand-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg-grad)" />
  <rect width="1200" height="260" rx="14" fill="url(#grid)" />
  <rect width="1200" height="260" rx="14" fill="url(#glow-cyan)" />
  <rect width="1200" height="260" rx="14" fill="url(#glow-emerald)" />
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="13.5" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left Helix & Cryptographic Node Motif -->
  <g transform="translate(62, 34)">
    <rect x="0" y="0" width="166" height="192" rx="12" fill="#0B1324" stroke="#1E3A5F" stroke-width="1.2" />
    <line x1="20" y1="28" x2="146" y2="28" stroke="#1E293B" stroke-width="1" />
    <circle cx="26" cy="15" r="3" fill="#38BDF8" />
    <text x="36" y="19" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">CRYPTO / EVM</text>

    <!-- Stylized Double Helix + Verification Nodes -->
    <g transform="translate(31, 44)">
      <line x1="22" y1="14" x2="82" y2="14" stroke="#1E3A5F" stroke-width="2" />
      <line x1="12" y1="34" x2="92" y2="34" stroke="#1E3A5F" stroke-width="2" />
      <line x1="24" y1="54" x2="80" y2="54" stroke="#1E3A5F" stroke-width="2" />
      <line x1="80" y1="74" x2="24" y2="74" stroke="#1E3A5F" stroke-width="2" />
      <line x1="92" y1="94" x2="12" y2="94" stroke="#1E3A5F" stroke-width="2" />
      <line x1="80" y1="114" x2="24" y2="114" stroke="#1E3A5F" stroke-width="2" />

      <path d="M 18 4 C 8 28, 8 44, 52 64 C 96 84, 96 100, 86 124" fill="none" stroke="url(#strand-a)" stroke-width="3.6" stroke-linecap="round" />
      <path d="M 86 4 C 96 28, 96 44, 52 64 C 8 84, 8 100, 18 124" fill="none" stroke="url(#strand-b)" stroke-width="3.6" stroke-linecap="round" />

      <circle cx="18" cy="14" r="4" fill="#38BDF8" />
      <circle cx="86" cy="14" r="4" fill="#34D399" />
      <circle cx="12" cy="34" r="4" fill="#38BDF8" />
      <circle cx="92" cy="34" r="4" fill="#34D399" />
      <circle cx="52" cy="64" r="5.5" fill="#0B1324" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="92" cy="94" r="4" fill="#38BDF8" />
      <circle cx="12" cy="94" r="4" fill="#34D399" />
      <circle cx="84" cy="114" r="4" fill="#38BDF8" />
      <circle cx="20" cy="114" r="4" fill="#34D399" />
    </g>
  </g>

  <!-- Right Title, Architecture Summary & Spec Pills -->
  <g transform="translate(262, 46)">
    <text x="0" y="14" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Segoe UI', monospace" font-size="12" font-weight="600" letter-spacing="1.8">HẠ TẦNG DỮ LIỆU HỆ GEN TỰ CHỦ TRÊN EVM &amp; IPFS</text>
    <text x="0" y="64" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">GenoChain</text>
    <rect x="280" y="31" width="96" height="24" rx="6" fill="#0F2942" stroke="#1D4ED8" stroke-width="1" />
    <text x="328" y="47" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">EVM CANCUN</text>

    <text x="0" y="100" fill="#CBD5E1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Mã hóa AEAD phân đoạn 64 KB phía máy khách, ký quỹ khóa thời gian phi lưu ký,</text>
    <text x="0" y="124" fill="#CBD5E1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">bản quyền chủ động EIP-2981, tìm kiếm ẩn danh và xác thực biến thể Groth16 BN254.</text>

    <!-- Spec Pills -->
    <g transform="translate(0, 150)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">
      <rect x="0" y="0" width="174" height="28" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="87" y="18" text-anchor="middle" fill="#7DD3FC">AES-256-GCM + GNC1</text>

      <rect x="186" y="0" width="150" height="28" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="261" y="18" text-anchor="middle" fill="#6EE7B7">RSA-OAEP 2048</text>

      <rect x="348" y="0" width="166" height="28" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="431" y="18" text-anchor="middle" fill="#E2E8F0">IPFS Kubo / Pinata</text>

      <rect x="526" y="0" width="184" height="28" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="618" y="18" text-anchor="middle" fill="#C4B5FD">GA4GH Phenopackets v2</text>

      <rect x="722" y="0" width="144" height="28" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="794" y="18" text-anchor="middle" fill="#FDE68A">Groth16 BN254</text>
    </g>
  </g>
</svg>
