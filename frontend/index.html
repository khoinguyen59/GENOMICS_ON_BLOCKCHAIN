<!doctype html>
<html lang="en" data-theme="light" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenoChain - Decentralized Genomic Data & Royalty Marketplace</title>
    <meta name="description" content="Decentralized Genomic Data Management & Sharing with Client-Side Encryption, IPFS, and EIP-2981 Royalty on Blockchain" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('geno_os2_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.remove('theme-dark', 'theme-light');
          document.documentElement.classList.add('theme-' + t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
