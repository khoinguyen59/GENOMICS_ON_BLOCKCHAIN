<!doctype html>
<html><head><meta charset="utf-8"><title>AGENT4_BROWSER_PROBE</title></head>
<body><pre id="out">BOOT</pre>
<script type="module">
const el = document.getElementById("out");
const L = [];
const say = (...a) => {
  L.push(a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" "));
  el.textContent = L.join("\n");          // incremental: visible even if dump happens early
};
window.addEventListener("error", (e) => say("WINDOW-ERROR: " + e.message));
try {
  say("userAgent: " + navigator.userAgent);
  say("secureContext=" + window.isSecureContext + " subtle=" + !!crypto.subtle + " indexedDB=" + typeof indexedDB);

  const kp = await crypto.subtle.generateKey(
    { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
    false, ["encrypt", "decrypt"]);
  say("[1] privateKey.extractable = " + kp.privateKey.extractable);
  say("[1] publicKey.extractable  = " + kp.publicKey.extractable);
  let expErr = null, jwk = null;
  try { jwk = await crypto.subtle.exportKey("jwk", kp.publicKey); } catch (e) { expErr = e; }
  say("[1] exportKey(jwk, publicKey) => " + (expErr ? `THREW ${expErr.name}: ${expErr.message}` : `OK n-len=${jwk.n.length}`));

  say("[2a] about to dynamic-import key_vault.js");
  const kv = await import("/crypto/storage/key_vault.js");
  say("[2b] imported. keys=" + Object.keys(kv).join(","));
  const acct = "0x1111111111111111111111111111111111111111";
  const missing = await kv.loadPersistentKeyPair(acct);
  say("[2] loadPersistentKeyPair(never-saved) typeof=" + typeof missing + " value=" + JSON.stringify(missing));
  say("[2] VERDICT: " + (missing === null ? "OK-null" : `DEFECT non-null sentinel (${JSON.stringify(missing)}) -> Web3Context.jsx:125 'if(!kp)' is FALSE`));

  const missingCap = await kv.loadOwnerCapsulePersistent("QmNoSuchCid");
  say("[2] loadOwnerCapsulePersistent(missing) typeof=" + typeof missingCap + " value=" + JSON.stringify(missingCap));

  await kv.savePersistentKeyPair(acct, kp);
  await kv.saveOwnerCapsulePersistent("QmTestCid", "{\"keyCipher\":\"aa\"}");
  const back = await kv.loadPersistentKeyPair(acct);
  say("[2] after save -> privateKey.extractable=" + (back && back.privateKey ? back.privateKey.extractable : "NOT-OBJECT:" + String(back)));
  const backCap = await kv.loadOwnerCapsulePersistent("QmTestCid");
  say("[2] after save -> ownerCapsule=" + JSON.stringify(backCap).slice(0, 60));
  say("DONE");
} catch (e) {
  say("FATAL " + ((e && e.stack) || e));
}
</script></body></html>
